<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Police Inter (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ========== EN-TÊTE ========== -->
    <header class="en-tete">
        <div class="conteneur en-tete__contenu">
            <a class="logo" href="index.html">Prénom Nom</a>
            <nav aria-label="Navigation principale">
                <ul class="menu">
                    <li><a href="index.html">Présentation</a></li>
                    <li><a href="projets.html">Projets</a></li>
                    <li><a href="">Contact</a></li>
                    <li><a href="aPropos.html">a-propos</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <!-- ========== CONTACT ========== -->
        <section id="contact" class="section section--claire">
            <div class="conteneur">
                <h2>Contact</h2>
                <p class="section__intro">Une question, une proposition ? Écrivez-moi.</p>

                <form class="formulaire" action="#" method="post">
                <label for="nom">Nom</label>
                <input id="nom" name="nom" type="text">

                <label for="email">E-mail</label>
                <input id="email" name="email" type="text">

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6"></textarea>

                <button class="bouton" type="submit">Envoyer</button>
                </form>

                <ul class="reseaux">
                <li><a class="lien" href="https://github.com/majdeddine-oumanni" target="_blank">GitHub</a></li>
                <li><a class="lien" href="https://www.linkedin.com/in/majdeddine-oumanni-463b04266" target="_blank">LinkedIn</a></li>
                </ul>
            </div>
        </section>
    </main>
      <!-- ========== PIED DE PAGE ========== -->
    <footer class="pied">
        <div class="conteneur">
            <p>© 2026 Majd Eddine Oumanni. Tous droits réservés.</p>
        </div>
    </footer>
